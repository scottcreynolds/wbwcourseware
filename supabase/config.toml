project_id = "writers-be-writing-courseware"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/**"]
jwt_expiry = 3600
enable_signup = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "25MiB"

[edge_runtime]
enabled = true
policy = "per_worker"

[analytics]
enabled = false

[functions.bootstrap-teacher]
verify_jwt = false
[functions.accept-invite]
verify_jwt = false
[functions.invite-student]
verify_jwt = true
[functions.submission-upload-intent]
verify_jwt = true
[functions.finalize-submission]
verify_jwt = true
[functions.submission-download]
verify_jwt = true
